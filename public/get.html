<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shurp - Brauc ar savējiem</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Shurp - Brauc ar savējiem">
    <link rel="canonical" href="https://shurp.lv/get" />

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://shurp.lv/get">
    <meta property="og:title" content="Shurp - Brauc ar savējiem">
    <meta property="og:description" content="Shurp - Brauc ar savējiem">
    <meta property="og:image" content="https://shurp.lv/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Shurp - Brauc ar savējiem">
    <meta name="twitter:description" content="Shurp - Brauc ar savējiem">
    <meta name="twitter:image" content="https://shurp.lv/assets/og-image.png">

    <!-- Minimal critical CSS for loader -->
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background-color: #125E8A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .loader {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            margin-top: 20px;
            color: #ffffff;
            font-size: 16px;
        }

        .message-en {
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .fallback {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            text-decoration: underline;
        }

        .fallback-en {
            display: block;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="loader" class="loader" aria-hidden="true"></div>
        <p class="message">Novirzām uz veikalu...</p>
        <p class="message-en">Redirecting to the store...</p>
        <a id="fallback-link" class="fallback" href="https://shurp.lv/lv/">
            Turpināt manuāli
            <span class="fallback-en">Continue manually</span>
        </a>
        <a id="back-link" class="fallback" href="/lv/">Atpakaļ / Back</a>
    </div>

    <!-- No-JS fallback -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://shurp.lv/lv/" />
    </noscript>

    <script>
        (function () {
            var IOS_URL = 'https://apps.apple.com/app/shurp/id6760924489';
            var ANDROID_URL = 'https://play.google.com/store/apps/details?id=lv.shurp.app&pcampaignid=web_share';
            var DEFAULT_URL = 'https://shurp.lv/lv/';
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);
            var targetUrl = isIOS ? IOS_URL : (isAndroid ? ANDROID_URL : DEFAULT_URL);
            var fallbackLink = document.getElementById('fallback-link');
            fallbackLink.href = targetUrl;
            var timer;
            var departed = false;
            function showFallback() {
                clearTimeout(timer);
                document.getElementById('loader').hidden = true;
                document.querySelector('.message').textContent = 'Turpināt Shurp';
                document.querySelector('.message-en').textContent = 'Continue to Shurp';
            }
            fallbackLink.addEventListener('click', function (event) {
                event.preventDefault();
                showFallback();
                window.location.replace(targetUrl);
            });
            var backLink = document.getElementById('back-link');
            try {
                var previous = new URL(document.referrer);
                if (previous.origin === location.origin && !/^\/get(?:\.html)?\/?$/.test(previous.pathname)) {
                    backLink.href = previous.href;
                    backLink.addEventListener('click', function (event) {
                        event.preventDefault(); clearTimeout(timer);
                        if (history.length > 1) history.back(); else location.replace(backLink.href);
                    });
                }
            } catch (_) { /* Direct visits keep a usable homepage link. */ }
            addEventListener('pagehide', function () { departed = true; clearTimeout(timer); });
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) { departed = true; showFallback(); }
                else if (departed) showFallback();
            });
            addEventListener('pageshow', function (event) { if (event.persisted) showFallback(); });
            var navigation = performance.getEntriesByType('navigation')[0];
            if (navigation && navigation.type === 'back_forward') { showFallback(); return; }
            timer = setTimeout(function () {
                // Replace the handoff entry: Back must return to the previous page,
                // rather than replaying this automatic store redirect.
                showFallback();
                window.location.replace(targetUrl);
            }, 400);
        })();
    </script>
</body>

</html>
